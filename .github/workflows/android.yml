name: Android arm64
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install NDK
        run: sdkmanager "ndk;29.0.14206865"
      - name: Build current objc4 for Android arm64
        run: ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/29.0.14206865" ./scripts/build-android.sh "${{ matrix.configuration }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: objc4-android-arm64-${{ matrix.configuration }}
          path: |
            build/android-arm64-${{ matrix.configuration }}/libobjc4.so
            build/android-arm64-${{ matrix.configuration }}/libobjc4-test-plugin.so
            build/android-arm64-${{ matrix.configuration }}/objc4-android-smoke
            build/android-arm64-${{ matrix.configuration }}/objc4-android-cache
            build/android-arm64-${{ matrix.configuration }}/objc4-android-benchmark
